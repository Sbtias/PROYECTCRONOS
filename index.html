<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070b12">
<title>Shooter of Sbtias</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="hud">
  <div class="brand">SHOOTER OF SBTIAS</div>
  <div class="stats"><span>ENEMIGOS <b id="enemies">0</b></span><span>PUNTOS <b id="score">0</b></span></div>
  <div id="health"><i></i></div>
  <div id="message"></div>
</div>
<div id="crosshair"><span></span></div>
<div id="start">
  <div class="panel">
    <h1>SHOOTER OF<br><strong>SBTIAS</strong></h1>
    <p>Sobrevive a las oleadas y elimina a los drones.</p>
    <button id="play">JUGAR</button>
    <small>PC: WASD + ratón · Móvil: joystick + apuntar + disparar</small>
  </div>
</div>
<div id="touch">
  <div id="stick"><div id="knob"></div></div>
  <button id="fire">DISPARAR</button>
  <button id="dash">⚡</button>
</div>
<script type="module" src="script.js"></script>
</body>
</html>
