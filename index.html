<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PhoneOS</title><link rel="stylesheet" href="style.css"></head><body><div class="ambient"></div><header class="nav"><div class="brand">● PhoneOS</div><button class="ghost">Cuenta</button></header><main><section id="authView" class="auth-wrap"><div class="intro"><span class="eyebrow">PHONEOS</span><h1>Tu teléfono.<br><em>A tu manera.</em></h1><p>Una experiencia de teléfono virtual moderna y personalizable.</p></div><div class="auth-card"><div class="segmented"><button class="active" data-mode="login">Iniciar sesión</button><button data-mode="register">Registrarse</button></div><form id="authForm"><label>Nombre de usuario<input id="username" required placeholder="Tu nombre"></label><label id="emailLabel" class="hidden">Correo<input id="email" type="email" placeholder="tu@email.com"></label><label>Contraseña<input id="password" type="password" required minlength="4" placeholder="••••••••"></label><button class="primary" type="submit"><span id="authText">Continuar</span><span>→</span></button></form><p id="authMsg" class="msg"></p></div></section><section id="phoneView" class="phone-section hidden"><div class="phone-top"><div><span class="eyebrow">PHONEOS STUDIO</span><h2>Hola, <span id="hello"></span> 👋</h2></div><button id="logout" class="ghost">Cerrar sesión</button></div><div class="studio"><div class="phone-shell" id="phone"><div class="dynamic-island"></div><div class="status"><span id="time">9:41</span><span>⌁ ᯤ ▰</span></div><div class="lock-content"><div id="bigTime">9:41</div><div id="date"></div></div><div class="widgets"><div class="widget">☀️<b>24°</b><small>San Juan</small></div><div class="widget"><b>87%</b><small>Batería</small></div></div><div class="dock"><span>☎</span><span>✉</span><span>◎</span><span>⚙</span></div><div class="home-indicator"></div></div><div class="controls"><h3>Personaliza tu teléfono</h3><div class="control"><span>Color</span><input id="accent" type="color" value="#ffffff"></div><div class="control"><span>Fondo</span><div class="swatches"><button data-bg="#050505"></button><button data-bg="#101827"></button><button data-bg="#1b1027"></button><button data-bg="#10251d"></button></div></div><div class="control"><span>Nombre en pantalla</span><input id="phoneName" maxlength="18"></div><button id="save" class="primary">Guardar personalización <span>✓</span></button><p id="saveMsg" class="msg"></p></div></div></section></main><script src="script.js"></script></body></html>
